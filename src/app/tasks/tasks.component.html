<section id="tasks">
  <header>
    <h2>{{ name }}'s tasks</h2>
    <menu>
      <button (click)="onClickAddTask()">Add Task</button>
    </menu>
  </header>
  <ul>
    @for (task of selectedUserTasks; track task.id) {
    <li>
      <app-task [task]="task"></app-task>
    </li>
    } @if (isAddingTask) {
    <app-new-task
      (closeAddTask)="onCloseAddTask()"
      [userId]="userId"
    ></app-new-task>
    }
  </ul>
</section>
